static=TikTok, Proxies, 🎯Direct, img-url=https://rawstatic.com/blackmatrix7/ios_rule_script/master/icon/qure/color/TikTok_1.png
static=✈️Final, Proxies, 🎯Direct, img-url=https://rawstatic.com/blackmatrix7/ios_rule_script/master/icon/qure/color/Final.png

