name: Validate rules

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check rules and repository paths
        run: python scripts/validate_rules.py
      - name: Check generated README statistics
        run: python scripts/generate_readme.py --check
      - name: Check external URLs
        if: github.event_name == 'schedule'
        run: python scripts/validate_rules.py --check-external-urls
