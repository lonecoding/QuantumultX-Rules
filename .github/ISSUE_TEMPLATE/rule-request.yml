name: Rule request
description: Request routing rules for a domain or service
title: "[Rule request] "
labels: []
body:
  - type: input
    id: service
    attributes:
      label: Service name
      placeholder: For example, GitHub or Netflix
    validations:
      required: true
  - type: input
    id: domain
    attributes:
      label: Domains or networks
      placeholder: example.com or 203.0.113.0/24
    validations:
      required: true
  - type: input
    id: policy
    attributes:
      label: Suggested policy group
      placeholder: Proxies, 🎯Direct, or an existing policy group
    validations:
      required: true
  - type: textarea
    id: source
    attributes:
      label: Evidence
      description: Include domain sources, request logs, or official documentation URLs.
    validations:
      required: true
  - type: textarea
    id: test
    attributes:
      label: Testing
      description: Describe your device, network, and whether the rules have been tested.
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing rules and issues and found no duplicate.
          required: true
        - label: I included no servers, subscriptions, keys, or private information.
          required: true
