name: False positive
description: Report an app or site affected by advertising rules
title: "[False positive] "
labels: []
body:
  - type: input
    id: product
    attributes:
      label: App or website
      placeholder: For example, an app name or example.com
    validations:
      required: true
  - type: input
    id: domain
    attributes:
      label: Blocked domain
      description: Find this in the Quantumult X request log.
      placeholder: ads.example.com
    validations:
      required: true
  - type: dropdown
    id: rule
    attributes:
      label: Matching rule
      options:
        - rules/Advertising/Advertising.list
        - Other rule
        - Not sure
    validations:
      required: true
  - type: textarea
    id: symptom
    attributes:
      label: Symptoms
      description: Describe loading errors, failed sign-ins, or other specific symptoms.
    validations:
      required: true
  - type: textarea
    id: test
    attributes:
      label: Troubleshooting
      description: Does disabling the rule resolve the problem? Include request logs with private information removed, if available.
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I checked whether enabling or disabling the matching rule reproduces or resolves the problem.
          required: true
        - label: I included no servers, subscriptions, keys, or private information.
          required: true
